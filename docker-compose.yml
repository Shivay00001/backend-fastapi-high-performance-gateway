services:
  gateway:
    build: .
    ports:
      - "8006:8006"
    environment:
      - GATEWAY_DB=/app/data/gateway_logs.db
    volumes:
      - ./routes.yaml:/app/routes.yaml:ro
      - gw_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  gw_data:
